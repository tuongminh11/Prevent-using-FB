<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Social Media Timer</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2133;
    --accent: #5b8cff;
    --accent-warn: #ff6b6b;
    --text: #e9edf5;
    --text-dim: #9aa4b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #232b40;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  #list {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
  }
  .site-card {
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .site-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .site-name { font-weight: 600; font-size: 13px; }
  .site-time { font-size: 12px; color: var(--text-dim); }
  .bar-bg {
    height: 8px;
    border-radius: 4px;
    background: #2a3350;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .bar-fill.over { background: var(--accent-warn); }
  .empty {
    padding: 24px 12px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  footer {
    padding: 10px 12px 14px;
    border-top: 1px solid #232b40;
  }
  button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
</style>
</head>
<body>
  <header>
    <h1>⏱ Social Media Timer</h1>
  </header>
  <div id="list"><div class="empty">Loading...</div></div>
  <footer>
    <button id="openOptions">Manage & Statistics</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
